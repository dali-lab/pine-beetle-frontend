# ArcGIS hosted tile services return PNG tiles mislabeled as
# application/octet-stream. Chrome sniffs and renders them, but Firefox-based
# browsers (Zen, Firefox) refuse to decode a non-image content type, so the
# raster never appears. Force the correct type on the proxied tile path.
[[headers]]
  for = "/arcgis-tiles/*"
  [headers.values]
    Content-Type = "image/png"
